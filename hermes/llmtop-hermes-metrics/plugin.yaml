name: llmtop-hermes-metrics
version: 2.3.89
description: "Datensparsame Hermes-Agent-Laufmetriken für llmtop; nur Observer-Hooks, keine Inhalte."
author: "llmtop"
kind: standalone
requires_hermes: ">=0.23"
platforms:
  - linux
provides_hooks:
  - pre_llm_call
  - post_llm_call
  - pre_api_request
  - post_api_request
  - api_request_error
  - pre_auxiliary_call
  - post_auxiliary_call
  - pre_tool_call
  - post_tool_call
  - post_compaction
  - subagent_start
  - subagent_stop
  - on_session_end
  - agent_loop_stopped
